<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI 도움 — 표현 찾기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1F1F}a:hover{color:#000}
button,a[href],summary{position:relative}
button::after,a[href]::after,summary::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:44px;transform:translate(-50%,-50%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8F8F8B; color: #1F1F1F; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <div aria-hidden="true" style="flex-grow: 1; padding: 60px 20px 0; color: #4A4A47; font-size: 13px">답장 쓰기 (뒤에 흐리게)</div>

  <section aria-label="AI 도움" style="height: 676px; box-sizing: border-box; background: #FFFFFF; border-radius: 20px 20px 0 0; border-top: 2px dashed #5E5E5E; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 34px">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C8C8C4"></div>

    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 16px; font-weight: 700">함께 답장 생각하기</span>
      <span style="font-size: 12px; padding: 0 6px; height: 20px; display: inline-flex; align-items: center; border-radius: 3px; font-weight: 500; border: 1px dashed #5E5E5E; color: #5E5E5E">AI 도움 · 나만 보여요</span>
      <a href="LT02.dc.html" aria-label="닫기" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EDEDEA; border-radius: 10px; padding: 3px">
      <button type="button" role="tab" aria-selected="true" style="min-height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #1F1F1F">표현 찾기</button>
      <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border: 0; border-radius: 8px; background: transparent; font-family: inherit; font-size: 14px; color: #5E5E5E">다듬기</button>
    </div>

    <div style="font-size: 13px; line-height: 19px; color: #5E5E5E; padding: 10px 12px; background: #F4F4F2; border-radius: 8px">Maya의 질문 · 집처럼 편하게 느끼는 작은 습관이 있어요?</div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="thought" style="font-size: 14px; font-weight: 700">어떤 이야기를 전하고 싶나요?</label>
      <textarea id="thought" value="{{thought}}" readOnly="{{yes}}" style="resize: none; height: 72px; box-sizing: border-box; border: 1px solid #D6D6D2; border-radius: 10px; padding: 12px; font-family: inherit; font-size: 15px; line-height: 22px; color: #1F1F1F"></textarea>
    </div>

    <div role="radiogroup" aria-label="제안" style="display: flex; flex-direction: column; gap: 8px">
      <label style="display: flex; gap: 10px; padding: 14px; border: 2px solid #1F1F1F; border-radius: 10px">
        <input type="radio" name="pick" checked="{{yes}}" readOnly="{{yes}}" style="margin: 3px 0 0; width: 18px; height: 18px; accent-color: #1F1F1F">
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; line-height: 22px; font-weight: 500">We made a mess, but that made it even more fun.</span>
          <span style="font-size: 13px; color: #5E5E5E">엉망이었던 게 오히려 즐거웠다는 느낌</span>
        </span>
      </label>
      <label style="display: flex; gap: 10px; padding: 14px; border: 1px solid #D6D6D2; border-radius: 10px">
        <input type="radio" name="pick" style="margin: 3px 0 0; width: 18px; height: 18px; accent-color: #1F1F1F">
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; line-height: 22px; font-weight: 500">It was messy, but we laughed the whole time.</span>
          <span style="font-size: 13px; color: #5E5E5E">내내 웃었다는 장면이 보이는 표현</span>
        </span>
      </label>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 52px; border: 1px solid #1F1F1F; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1F1F1F">다르게 표현하기</button>
        <a href="LT02.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; background: #1F1F1F; color: #FFFFFF; border-radius: 12px; font-size: 15px; font-weight: 700; text-decoration: none">편지에 넣기</a>
      </div>
      <span style="font-size: 13px; color: #5E5E5E; text-align: center">편지에는 고른 한 문장만 들어가요 · 오늘 남은 쓰기 도움 9회</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, thought: "딸이랑 요리했는데 엉망이었지만 그래서 더 웃겼어." };
}
}
</script>
</body>
</html>
