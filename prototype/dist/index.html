;padding:5px 10px;border:1px solid #dddde5;border-radius:20px;color:var(--muted);letter-spacing:.1px}.subtitle{color:var(--muted);margin-top:11px;font-size:15px}.section{margin-top:28px}.tabs{display:flex;background:#ebebef;padding:5px;border-radius:16px;margin:28px 0 22px;gap:4px}.tabs button{width:50%;min-height:43px;color:var(--muted);border-radius:12px;font-size:14px}.tabs button.selected{background:#fff;color:var(--ink);box-shadow:0 2px 4px #20212406;font-weight:650}.tabs span{margin-left:8px;font-size:12px}.group{background:#fff;border-radius:24px;padding:0 22px}.person{display:flex;align-items:center;gap:16px;width:100%;padding:25px 0;text-align:left;min-width:0}.person+.person{border-top:1px solid var(--line)}.avatar{width:52px;height:52px;display:grid;place-items:center;background:#eeedf1;border-radius:50%;flex-shrink:0;overflow:hidden;color:#4d4c55;font-size:20px;font-weight:500}.avatar svg{height:40px;width:40px;stroke-width:1.15}.avatar.o{background:#eef0ed}.avatar.h{background:#eeedf4}.persontext{flex:1;min-width:0}.persontext strong{display:flex;align-items:center;gap:8px;font-size:17px}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:#50515a;margin-top:3px}.persontext small{display:block;margin-top:5px;font-size:12px}.dot{width:7px;height:7px;background:var(--accent);border-radius:50%}.chev{color:#85858c;width:17px}.draft{width:100%;display:flex;align-items:center;gap:16px;border-radius:22px;background:#fff;padding:21px 22px;text-align:left;margin-top:16px}.draft>svg:first-child{width:24px;height:24px}.draft div{flex:1}.draft strong{font-size:15px;display:block}.quiet{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;margin:30px 0}.quiet svg{width:15px;height:15px}.mobile-nav{display:none}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:26px;min-height:44px}.toolbar .center{flex:1;text-align:center;font-weight:650;font-size:15px}.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#ececf0;flex-shrink:0}.toolbar .save{font-size:11px;max-width:110px;line-height:1.4;color:var(--muted)}.profilehead{display:flex;align-items:center;gap:18px;margin:34px 0}.profilehead .avatar{width:68px;height:68px}.profilehead small{display:block;margin-top:5px}.bodycopy{font-size:17px;line-height:1.85;margin-top:12px;letter-spacing:-.1px}.prompt{background:#fff;border-radius:24px;padding:24px;margin-top:26px}.promptblock{display:flex;gap:15px}.promptblock svg{margin-top:4px}.promptblock+ .promptblock{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}.promptblock small{font-size:12px}.promptblock p{margin-top:6px;font-size:16px;line-height:1.65}.textbtn{font-size:13px;font-weight:650;display:inline-flex;gap:8px;align-items:center;padding:13px 0 0}.textbtn svg{width:14px;height:14px}.preferences{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin:24px 0;font-size:12px;color:var(--muted)}.preferences svg{width:15px;height:15px}.primary{background:#202124;color:white;border-radius:17px;padding:17px 20px;width:100%;font-size:15px;font-weight:650;min-height:56px}.secondary{background:#fff;border-radius:16px;padding:15px 20px;width:100%;min-height:50px;font-size:14px}.actions{position:sticky;bottom:0;padding:14px 0 18px;background:var(--bg);margin-top:14px}.reference{background:#ebebef;border-radius:15px;margin-bottom:22px}.reference>button{display:flex;align-items:center;gap:10px;padding:15px;width:100%;text-align:left;font-size:13px}.reference>button svg:last-child{margin-left:auto;width:17px}.reference p{padding:0 18px 18px;font-size:14px;line-height:1.8;color:#50515a}.composer{display:flex;flex-direction:column;min-height:calc(100dvh - 160px)}textarea{width:100%;resize:vertical;min-height:320px;flex:1;border:0;background:transparent;color:var(--ink);padding:5px 2px;font-size:18px;line-height:1.85;border-radius:4px}textarea::placeholder{color:#777982 </style></head><body><div class="layout"><aside class="rail"><div class="brand" id="brand"></div><p>멀리 있는 일상과<br>조금씩 가까워지는 시간.</p><nav id="desktopNav" aria-label="주 메뉴"></nav><div class="railfooter"><b>서두르지 않아도 괜찮아요.</b><br>좋은 이야기는 자기만의 속도로.<br><br>밍팔 · 인터랙티브 시안</div></aside><main id="main"></main></div><nav class="mobile-nav" id="mobileNav" aria-label="하단 메뉴"></nav><div id="modal"></div><div id="toast" role="status" hidden></div><script>
const paths={mail:'M3 5h18v14H3z M3 6l9 7 9-7',search:'M21 21l-5-5 M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16',user:'M4 21v-3a8 5 0 0 1 16 0v3z M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8',back:'M15 5l-7 7 7 7',next:'M9 5l7 7-7 7',close:'M6 6l12 12 M6 18L18 6',pen:'M15 4l5 5 M4 20l5-1L21 7l-5-5L4 14z',sun:'M12 3V1 M12 23v-2 M3 12H1 M23 12h-2 M4 4l2 2 M18 18l2 2 M4 20l2-2 M18 6l2-2 M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10',chat:'M21 11a9 8 0 0 1-12 8l-6 2 2-6A9 8 0 1 1 21 11z M8 11h.01 M12 11h.01 M16 11h.01',clock:'M12 8v5l3 2 M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20',check:'M5 12l4 4L19 6',doc:'M14 2H5v20h14V7z M14 2v6h5 M8 12h8 M8 16h8',arrow:'M5 19L19 5 M7 5h12v12',help:'M9 17h6 M10 21h4 M8 14c-7-8 9-13 9-4 0 2-1 3-2 4v3H9v-3',more:'M5 12h.01 M12 12h.01 M19 12h.01',face:'M5 34c1-9 25-9 26 0 M12 22l-2 7 M24 22l2 7 M9 13c0-14 20-14 20 0v6c0 14-20 14-20 0z M9 14c8 0 8-8 9-8 2 6 7 7 11 8 M14 18h.1 M24 18h.1 M16 24q3 2 6 0'};
const icon=(n,c='')=>`<svg class="${c}" viewBox="0 0 ${n==='face'?'40 40':'24 24'}" aria-hidden="true"><path d="${paths[n]||paths.mail}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=(id='m')=>`<span class="avatar ${id}">${icon('face')}</span>`;
const incoming={Maya:'Hi Jiyun,\n\nThis morning I found a tiny bakery tucked away on a quiet street. The windows were foggy, and the whole place smelled like warm cinnamon.\n\nI picked a pastry I had never tried before and took the long way home. It was such a small thing, but it made my Saturday feel special.\n\nWhat does a slow weekend morning look like where you live? I would love to hear about it.\n\nWarmly,\nMaya',Oliver:'Hi Jiyun,\n\nI finally visited the little bookshop near my home. The owner recommended a novel I would never have picked myself.\n\nDo you have a favorite place to find books?\n\nOliver',Hana:'Hi Jiyun,\n\nIt rained all weekend, so I stayed home and made soup. My kitchen smelled wonderful.\n\nWhat do you like to cook on rainy days?\n\nHana'};
let state={page:'mail',tab:'friends',name:'Maya',origin:'mail',drafts:{},sent:[],large:false},storageOK=true,lastFocus=null;
try{const saved=JSON.parse(localStorage.getItem('mingpal-prototype-v1')||'null');if(saved&&saved.drafts&&Array.isArray(saved.sent))Object.assign(state,{drafts:saved.drafts,sent:saved.sent,large:!!saved.large})}catch{storageOK=false}
function persist(){try{localStorage.setItem('mingpal-prototype-v1',JSON.stringify({drafts:state.drafts,sent:state.sent,large:state.large}));storageOK=true}catch{storageOK=false}return storageOK}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.hidden=true,3200)}
function nav(){const items=[['mail','mail','우편함'],['find','search','친구 찾기'],['space','user','내 공간']];document.querySelector('#desktopNav').innerHTML=items.map(([p,i,t])=>`<button class="navitem ${state.page===p?'active':''}" data-go="${p}" ${state.page===p?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('');document.querySelector('#mobileNav').innerHTML=items.map(([p,i,t])=>`<button class="${state.page===p?'active':''}" data-go="${p}" ${state.page===p?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('')}
function toolbar(title,back='mail',save=false){return `<div class="toolbar"><button class="iconbtn" data-go="${back}" aria-label="${save?'저장하고 닫기':'뒤로 가기'}">${icon(save?'close':'back')}</button><span class="center">${title}</span>${save?`<span class="save" id="saveStatus" role="status">${storageOK?'기기에 저장됨':'저장되지 않음'}</span>`:'<span style="width:44px"></span>'}</div>`}
function top(label){return `<div class="topline"><span class="eyebrow">${label}</span><span class="demo">체험용 시안</span></div>`}
function row(name,id,preview,status){return `<button class="person" data-read="${name}">${avatar(id)}<span class="persontext"><strong>${name}${name==='Maya'?'<i class="dot" aria-label="읽지 않은 편지"></i>':''}</strong><span class="preview">${preview}</span><small>${status}</small></span>${icon('next','chev')}</button>`}
function mailbox(){return `${top('밍팔')}<div class="mail-heading"><h1>우편함</h1><p class="subtitle">천천히 이어가는 우리의 이야기</p></div><div class="tabs" aria-label="편지 종류"><button data-tab="friends" class="${state.tab==='friends'?'selected':''}" aria-pressed="${state.tab==='friends'}">친구<span>3</span></button><button data-tab="requests" class="${state.tab==='requests'?'selected':''}" aria-pressed="${state.tab==='requests'}">첫 편지<span>${state.sent.filter(s=>s.first).length}</span></button></div>${state.tab==='friends'?`<div class="group">${row('Maya','m','A quiet Saturday morning','새 편지 · 오늘')}${row('Oliver','o','The little bookshop near my home','답장 기다리는 중 · 2일 전')}${row('Hana','h','What do you cook on rainy days?','답장할 차례 · 3일 전')}</div>`:state.sent.some(s=>s.first)?`<div class="group">${state.sent.filter(s=>s.first).map(s=>`<button class="person" data-sent="${s.id}">${avatar('o')}<span class="persontext"><strong>${esc(s.name)}</strong><span class="preview">${esc(s.text)}</span><small>답장 기다리는 중 · 체험 전송</small></span>${icon('next')}</button>`).join('')}</div>`:`<div class="group empty">${icon('mail')}<h3>아직 첫 편지가 없어요</h3><p>궁금한 사람에게 작은 이야기를 건네보세요.</p><button class="textbtn" data-go="find">친구 만나러 가기 ${icon('arrow')}</button></div>`}${Object.keys(state.drafts).filter(n=>state.drafts[n].trim()).map(n=>`<button class="draft" data-compose="${esc(n)}">${icon('pen')}<div><strong>쓰던 편지</strong><small>${esc(n)}에게 · ${storageOK?'기기에 저장됨':'현재 화면에만 보관 중'}</small></div>${icon('next','chev')}</button>`).join('')}${state.sent.some(s=>!s.first)?`<div class="section"><small>보낸 편지</small><div class="group" style="margin-top:12px">${state.sent.filter(s=>!s.first).map(s=>`<button class="person" data-sent="${s.id}"><span class="persontext"><strong>${esc(s.name)}에게</strong><span class="preview">${esc(s.text)}</span><small>체험 전송 완료</small></span>${icon('check')}</button>`).join('')}</div></div>`:''}<div class="quiet">${icon('clock')}답장은 각자의 속도로, 이야기는 천천히.</div>`}
function profile(){const n=state.name;return `${toolbar('친구 소개',state.origin)}<div class="profilehead">${avatar(n==='Noah'?'o':'m')}<div><h2>${n==='Maya'?'Maya Thompson':n}</h2><small>${n==='Noah'?'영국':'캐나다'} · 영어로 편지해요</small></div></div><h3>안녕, 나는 ${n}예요</h3><p class="bodycopy" lang="en">I collect little moments: a good cup of coffee, a new book, and walks with no destination. I would love to hear about your ordinary days.</p><div class="prompt"><div class="promptblock">${icon('sun')}<div><small>요즘 나의 작은 즐거움</small><p lang="en">Trying a different bakery every Saturday morning.</p></div></div><div class="promptblock">${icon('chat')}<div><small>친구에게 궁금한 것</small><p lang="en">What does a slow weekend morning look like where you live?</p><button class="textbtn" data-compose="${n}">이 이야기로 편지 쓰기 ${icon('arrow')}</button></div></div></div><div class="preferences">${icon('clock')} 답장 3–5일 <span>·</span>${icon('doc')} 적당한 길이의 편지</div><div class="actions"><button class="primary" data-compose="${n}">${state.drafts[n]?'이어서 쓰기':n==='Noah'?'첫 편지 쓰기':'답장 쓰기'}</button></div>`}
function find(){return `${top('새로운 이야기')}<h1>친구 찾기</h1><p class="subtitle">작은 일상에서, 대화의 시작을 찾아요.</p><article class="discover"><div class="profilehead">${avatar('o')}<div><h2>Noah</h2><small>영국 · 답장 3–5일</small></div></div><small>친구에게 궁금한 것</small><p class="bodycopy" lang="en">What does a slow weekend morning look like where you live?</p><div class="preferences" style="justify-content:flex-start;margin:18px 0 0">산책 <span>·</span> 책 <span>·</span> 동네 카페</div><button class="primary" data-profile="Noah">이 친구 알아보기</button></article><div class="quiet">한 사람의 이야기를 충분히 읽어보세요.</div>`}
function read(){return `${toolbar('도착한 편지')}<button class="stamp" style="width:100%;text-align:left" data-profile="${state.name}">${avatar()}<span style="flex:1"><strong>${state.name}</strong><small>10월 28일 · 샘플 편지</small></span>${icon('next','chev')}</button><div class="letter" lang="en">${esc(incoming[state.name]||incoming.Maya)}</div><button class="textbtn" data-action="translate">${icon('help')} AI 해석 예시 보기</button><div class="actions"><button class="primary" data-compose="${state.name}">${state.drafts[state.name]?'답장 이어 쓰기':'답장 쓰기'}</button></div>`}
function compose(){return `${toolbar(esc(state.name)+'에게',state.composeBack||'mail',true)}<div class="composer"><div class="reference"><button data-action="reference" aria-expanded="false">${icon('doc')}${state.name}의 이야기 보기${icon('next')}</button><p id="referenceText" hidden lang="en">What does a slow weekend morning look like where you live?</p></div><label for="letterInput" class="muted" style="font-size:12px;margin-bottom:12px">나의 편지</label><textarea id="letterInput" aria-label="영어 편지 본문" placeholder="Hi ${state.name},&#10;&#10;상대의 이야기에서 궁금했던 점을 적어보세요." spellcheck="true">${esc(state.drafts[state.name]||'')}</textarea><div class="actions"><div class="tools"><button data-action="topics">${icon('sun')}이야기 소재</button><button data-action="help">${icon('help')}영어 도움</button></div><button class="primary" id="reviewButton" data-go="review" ${!(state.drafts[state.name]||'').trim()?'disabled':''}>보내기 전 확인</button></div></div>`}
function review(){return `${toolbar('보내기 전 확인','compose')}<div class="stamp">${avatar()}<div><strong>${state.name}에게</strong><small>${state.name==='Noah'?'첫 편지':'답장'}</small></div></div><div class="letter" lang="en">${esc(state.drafts[state.name]||'')}</div><p class="hint">체험용 전송입니다. 실제 상대에게 전달되지 않아요.<br>정식 서비스에서는 보낸 편지를 수정하거나 회수할 수 없어요.</p><div class="actions reviewactions"><button class="secondary" data-go="compose">수정하기</button><button class="primary" data-action="send">체험 전송하기</button></div>`}
function space(){return `${top('나를 위한 작은 공간')}<h1>내 공간</h1><div class="profilehead">${avatar('h')}<div><h2>Jiyun</h2><small>한국 · 영어로 편지해요</small></div></div><div class="group"><div class="setting"><div><strong>큰 글자로 읽기</strong><br><small>소개와 편지 본문을 더 크게</small></div><button class="switch ${state.large?'on':''}" role="switch" aria-checked="${state.large}" aria-label="큰 글자로 읽기" data-action="large"></button></div><div class="setting"><div><strong>초안 저장</strong><br><small>${storageOK?'이 브라우저에 저장하고 있어요':'저장할 수 없는 상태예요'}</small></div>${icon(storageOK?'check':'close')}</div></div><p class="hint">이 시안은 예시 인물과 편지로 구성되어 있어요. 초안은 현재 브라우저에만 저장되며, 실제 계정이나 편지 전송 서버에는 연결되어 있지 않아요.</p>`}
function render(){document.body.classList.toggle('detail',['profile','read','compose','review','done','sent'].includes(state.page));document.body.classList.toggle('large',state.large);nav();const pages={mail:mailbox,find,profile,read,compose,review,space,done:()=>`${toolbar('체험 전송 완료')}<div class="success"><div class="iconbtn">${icon('check')}</div><h2>편지를 보내는 흐름을<br>완료했어요</h2><p>${state.name}에게 쓴 이야기는<br>우편함의 보낸 편지에서 다시 볼 수 있어요.<br><small>실제 상대에게는 전달되지 않았어요.</small></p><button class="primary" data-go="mail">우편함으로</button></div>`,sent:()=>{const s=state.sent.find(s=>s.id===state.sentId);return `${toolbar('보낸 편지')}<h2>${esc(s?.name||'')}에게</h2><p class="hint">체험 전송 · 실제 전달되지 않음</p><div class="letter">${esc(s?.text||'')}</div>`}};document.querySelector('#main').innerHTML=(pages[state.page]||mailbox)()}
function go(page){if(state.page==='compose'&&!storageOK&&page!=='review'){toast('저장되지 않았어요. 글을 복사한 뒤 다시 시도해 주세요.');return}state.page=page;render();window.scrollTo(0,0)}
function sheet(title,content){lastFocus=document.activeElement;document.querySelector('#modal').innerHTML=`<div class="sheetveil"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header><h2 id="sheetTitle">${title}</h2><button class="iconbtn" data-action="closeSheet" aria-label="닫기">${icon('close')}</button></header>${content}</section></div>`;document.querySelector('.sheet button').focus()}
function closeSheet(){document.querySelector('#modal').innerHTML='';lastFocus?.focus()}
document.addEventListener('keydown',e=>{const s=document.querySelector('.sheet');if(!s)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const f=[...s.querySelectorAll('button,textarea,a[href]')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
document.addEventListener('input',e=>{if(e.target.id!=='letterInput')return;state.drafts[state.name]=e.target.value;persist();document.querySelector('#saveStatus').textContent=storageOK?'기기에 저장됨':'저장되지 않음';document.querySelector('#reviewButton').disabled=!e.target.value.trim()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.tab){state.tab=b.dataset.tab;render();return}if(b.dataset.read){state.name=b.dataset.read;go('read');return}if(b.dataset.profile){state.origin=state.page;state.name=b.dataset.profile;go('profile');return}if(b.dataset.compose){state.composeBack=state.page==='profile'?'profile':state.page==='read'?'read':'mail';state.name=b.dataset.compose;go('compose');return}if(b.dataset.sent){state.sentId=b.dataset.sent;go('sent');return}switch(b.dataset.action){case 'reference':{const p=document.querySelector('#referenceText');p.hidden=!p.hidden;b.setAttribute('aria-expanded',!p.hidden);break}case 'closeSheet':closeSheet();break;case 'topics':sheet('이야기 소재','<p class="muted">하나만 골라도 충분해요. 본문은 직접 써보세요.</p><div class="choice">지난 주말, 기억에 남는 작은 순간은?</div><div class="choice">우리 동네에서 가장 좋아하는 장소는?</div><div class="choice">상대의 아침 습관에서 궁금한 점은?</div>');break;case 'help':sheet('영어 도움','<p class="muted">표현을 골라 확인하는 체험 예시예요.<br>실시간 AI 교정은 아직 연결되지 않았어요.</p><div class="choice"><strong>“주말에 늦잠 잤어.”</strong><br>I slept in over the weekend.<small>sleep in은 평소보다 늦게까지 자는 것을 뜻해요.</small></div><button class="primary" data-action="insert">이 표현을 편지 끝에 넣기</button><p class="hint">직접 선택한 표현만 추가돼요. 기존 글은 바뀌지 않아요.</p>');break;case 'insert':state.beforeInsert=state.drafts[state.name]||'';state.drafts[state.name]=state.beforeInsert+(state.beforeInsert?'\n\n':'')+'I slept in over the weekend.';persist();closeSheet();render();sheet('표현을 추가했어요','<p>편지 끝에 추가했어요. 흐름에 맞게 수정해보세요.</p><button class="secondary section" data-action="undo">추가한 표현 되돌리기</button>');break;case 'undo':state.drafts[state.name]=state.beforeInsert;persist();closeSheet();render();break;case 'translate':sheet('AI 해석 · 예시',`<p>${state.name==='Maya'?'지윤, 안녕!<br><br>오늘 아침, 조용한 골목에 숨어 있는 작은 빵집을 찾았어. 창문에는 김이 서렸고, 가게 안은 따뜻한 계피 향으로 가득했지.<br><br>한 번도 먹어보지 않은 빵을 골라서 집으로 돌아가는 길을 조금 돌아갔어. 아주 작은 일이었지만 토요일이 특별하게 느껴졌어.<br><br>네가 사는 곳의 느긋한 주말 아침은 어떤 모습이야? 네 이야기도 듣고 싶어.':'이 편지의 실시간 해석은 아직 연결되지 않았어요.'}</p><p class="hint">미리 준비한 해석 예시이며 실시간 AI 응답이 아니에요.</p>`);break;case 'send':if(!(state.drafts[state.name]||'').trim())return;state.sent.unshift({id:String(Date.now()),name:state.name,text:state.drafts[state.name],first:state.name==='Noah'});delete state.drafts[state.name];if(!persist()){const s=state.sent.shift();state.drafts[state.name]=s.text;toast('저장 공간에 접근할 수 없어 전송을 완료하지 못했어요.');return}go('done');break;case 'large':state.large=!state.large;persist();render();break}});
window.addEventListener('beforeunload',e=>{if(!storageOK&&Object.values(state.drafts).some(Boolean)){e.preventDefault();e.returnValue=''}});
document.querySelector('#brand').innerHTML=icon('mail')+'밍팔';render();
</script></body></html>
